<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Installable as an app from the manifest alone. There is deliberately NO service worker: the server updates often
         and a caching worker would keep serving a stale UI after an update. Do not add one without a no-stale-UI design. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f1efeb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tofi" />
    <link rel="icon" type="image/svg+xml" href="/brand/tofi-app-icon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon-180.png" />
    <link rel="preload" href="/src/assets/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Tofi</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="tofi-layers"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
