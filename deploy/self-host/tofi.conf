# /run/tofi holds the Worker broker and per-account sockets; the App (uid 10001) reads them.
d /run/tofi 0750 0 10001 -
# The web page may write one file here to ask for an update (decision D69); the host reads it as root.
d /var/lib/tofi/update-request 0750 10001 10001 -
# status.json for the page, written by the host; the App mounts it read-only.
d /var/lib/tofi/update-status 0755 0 0 -
