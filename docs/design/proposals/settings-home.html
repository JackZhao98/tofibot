<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} html,body{margin:0}
body{background:#d9d4cc;color:#241b14;font:14px/1.5 "PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif;padding:0 0 60px}
.bar{position:sticky;top:0;z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px;background:#2a2019;color:#f1efeb}
.bar h1{font:600 15px/1.2 "Fredoka",system-ui,sans-serif;margin:0 auto 0 0}
.bar a{color:#f3c75a;text-decoration:none}
.seg{display:inline-flex;border:1px solid #6f6252;border-radius:999px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:#dcd8d1}
.seg button[aria-pressed="true"]{background:#f1efeb;color:#241b14}
.wrap{max-width:1320px;margin:20px auto;padding:0 20px}
.note{background:#fcfbf9;border:1px solid #dcd8d1;border-radius:12px;padding:12px 16px;margin:0 0 16px;font-size:13px;color:#54473a}
.note b{color:#241b14}
.pair{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.pair.side{grid-template-columns:repeat(2,minmax(0,1fr))}
figure.stage{min-width:0;overflow:hidden}
.pair.side .stage{transform-origin:top left}
figure.stage{margin:0}
figure.stage figcaption{font:500 12px/1.4 "PingFang SC",system-ui,sans-serif;color:#54473a;margin:0 0 8px}
.shot{display:block;width:100%;border:1px solid #bbb;border-radius:8px}
.frame{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 1px 0 rgb(0 0 0/.08),0 20px 50px rgb(0 0 0/.18);background:var(--bg);color:var(--ink);font:var(--type-body);}
.frame[data-skin] *{box-sizing:border-box}
.hidden{display:none!important}
.callouts{margin:16px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 16px;font-size:13px;color:#54473a}
.callouts li::before{content:counter(c) " ";counter-increment:c;font:600 11px/1 "JetBrains Mono",monospace;background:#e07f55;color:#1a140f;border-radius:999px;padding:3px 6px;margin-right:6px}
.callouts{counter-reset:c}
.tag{position:absolute;z-index:5;width:20px;height:20px;border-radius:999px;background:#e07f55;color:#1a140f;font:600 11px/20px "JetBrains Mono",monospace;text-align:center;box-shadow:0 0 0 2px #fff}

}

.frame[data-skin]{height:800px;display:grid;place-items:center;background:var(--bg)}
.frame[data-skin]::before{content:"";position:absolute;inset:0;background:var(--scrim,rgb(20 18 15/.3))}

.rail .it svg{width:16px;height:16px;color:var(--muted)}
.rail .it.on{background:var(--surface-2);color:var(--ink)}
.skin-current .rail .it.on{background:var(--surface);border:var(--edge-bold) solid var(--line);box-shadow:var(--hard)}

.rail .me .u{width:30px;height:30px;border-radius:50%;background:var(--iris);color:#fff;display:grid;place-items:center;font:600 13px/1 var(--display)}
.page{padding:28px 36px;overflow:hidden}
.page h2{margin:0;font:var(--type-title);color:var(--ink)} .page .sub{font:var(--type-meta);color:var(--muted);margin:4px 0 20px}
.close{position:absolute;right:20px;top:20px}
.skin-current .close{width:40px;height:40px;border:1px solid var(--line-soft);background:var(--surface);border-radius:10px;display:grid;place-items:center}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 8px;font:var(--type-ui,600 14px/1.4 var(--body));color:var(--ink);font-weight:600}
.card{border:1px solid var(--line-soft);border-radius:var(--radius-lg,16px);background:var(--surface)}
.skin-current .card{border-radius:12px}

.skin-current .srow{min-height:72px;padding:16px}
.srow + .srow{border-top:1px solid var(--line-soft)}

.sel{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 12px;border:1px solid var(--line-soft);border-radius:10px;background:var(--surface);font:var(--type-ui,14px var(--body));color:var(--ink)}
.skin-current .sel{height:40px;background:var(--surface-2);border-radius:12px}
.sg{display:inline-flex;padding:2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line-soft)}
.sg span{padding:5px 12px;border-radius:8px;font:var(--type-ui,14px var(--body));color:var(--muted)} .sg span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.skin-current .sg span.on{border:var(--edge) solid var(--line);box-shadow:var(--hard-sm)}
.sw{width:40px;height:24px;border-radius:999px;background:var(--line-soft);position:relative} .sw.on{background:var(--clay)} .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0/.2)} .sw.on::after{left:19px}
.btn{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:10px;border:1px solid var(--line-soft);background:var(--surface);font:var(--type-ui,600 14px var(--body));color:var(--ink)}
.skin-current .btn{border:var(--edge) solid var(--line);box-shadow:var(--hard-sm);font:var(--type-button)}
.prev{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 20px}
.prev .pc{border:1px solid var(--line-soft);border-radius:14px;padding:12px;display:grid;gap:8px;justify-items:center;font:var(--type-meta);color:var(--ink)}
.prev .pc.on{border:var(--edge-bold) solid var(--line);box-shadow:var(--hard)}
.prev .pc i{display:block;width:100%;height:60px;border-radius:8px;background:linear-gradient(90deg,var(--sunk) 0 22%,var(--surface) 22%)}
.prev .pc i.dk{background:linear-gradient(90deg,#2a2621 0 22%,#14120f 22%)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--lagoon) 14%,var(--surface));font:var(--type-meta);color:var(--ink-soft);margin:0 0 16px}
