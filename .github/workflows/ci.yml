name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt (every tracked .go file must be formatted)
        run: scripts/check-gofmt.sh
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        # TOFI_SKIP_TIMING=1 leaves out wall-clock latency bounds in Go tests (see docs/process.md 3.3); shared runners are too noisy for them.
        env:
          TOFI_SKIP_TIMING: '1'
        # internal/app runs 5-7 minutes on hosted runners; the 10-minute default timed out once (run 39711758364).
        run: go test -timeout 30m ./...

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui run test:i18n
      - run: npm --prefix ui run test:motion-tokens
      - run: npm --prefix ui run build

  # Browser guards. The scripts load Playwright from PLAYWRIGHT_MODULE (ui/package.json has no Playwright dependency).
  # TOFI_SKIP_TIMING=1 leaves out the clock-reading checks of test:dialogs and test:overlays; test:shell-budget runs
  # only its bundle-size part. See docs/process.md 3.3.
  ui-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOFI_SKIP_TIMING: '1'
      SHELL_BUDGET_ONLY: struct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - name: Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: npm --prefix ui run test:layers
      - run: npm --prefix ui run test:dialogs
      - run: npm --prefix ui run test:overlays
      - run: npm --prefix ui run test:shell-budget

  # The component catalog opens every state of every component in a browser: slow (minutes), no timing assertions.
  ui-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - name: Playwright with Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - run: npm --prefix ui run test:catalog

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The oldest supported host is Ubuntu 22.04 (Python 3.10).
          python-version: '3.10'
      - name: Install debugfs/e2fsck for release checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq e2fsprogs zstd poppler-utils
      - name: Worker and Guest release tests
        run: python3 -m unittest discover -s deploy/microvm -p 'test_*.py'
      - name: Host installer tests
        run: python3 -m unittest discover -s deploy/self-host -p 'test_*.py'
      - name: Release script tests
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Browser engine benchmark tests
        run: python3 -m unittest discover -s scripts/browser-bench -p 'test_*.py'
      - name: Built-in Skill script tests
        # Libraries the Bot computer image preinstalls; tests skip loudly without them.
        run: |
          python3 -m pip install --quiet openpyxl python-docx python-pptx==1.0.2 matplotlib reportlab pypdf pillow
          python3 -m unittest discover -s internal/extensions/builtin_skills/tests -p 'test_*.py'

  # The computer image installs @playwright/mcp from deploy/microvm/playwright-mcp (pinned by lock file). This job installs
  # it the way the image does and checks that every tool the guest relays still exists with the arguments it passes.
  # The real-Chrome test drives the pinned server against a headless Chrome of the runner; it is advisory
  # (continue-on-error) because the runner's Chrome is not the image's Chromium, and it was proven on the image only.
  playwright-mcp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the pinned package like the image
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        working-directory: deploy/microvm/playwright-mcp
      - name: Relayed tools still exist
        run: node check-tools.mjs
        working-directory: deploy/microvm/playwright-mcp
      - name: Guest relay tests (fake server)
        run: |
          sudo mkdir -p /usr/local/lib/tofi-playwright
          go test ./internal/computer/guest -run 'Playwright' -count=1
      - name: Guest relay against a real Chrome (advisory)
        continue-on-error: true
        run: |
          sudo mkdir -p /usr/local/lib/tofi-playwright
          sudo cp -r deploy/microvm/playwright-mcp/node_modules deploy/microvm/playwright-mcp/package.json /usr/local/lib/tofi-playwright/
          TOFI_PLAYWRIGHT_E2E=1 go test ./internal/computer/guest -run 'PlaywrightRealChrome' -count=1 -v

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n install.sh deploy/self-host/bin/tofi scripts/release/make_bundle.sh scripts/check-gofmt.sh scripts/check-release-notes.sh
      - name: shellcheck
        run: shellcheck install.sh deploy/self-host/bin/tofi scripts/release/make_bundle.sh scripts/check-gofmt.sh scripts/check-release-notes.sh
      - name: Release notes are well formed
        run: scripts/check-release-notes.sh --all

  runner-root:
    # The Runner's uid isolation, link-refusal, limit and purge tests need root on Linux and
    # skip everywhere else. Run them as root in a container with the default capabilities.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: mcprunner as root on Linux
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.25.11 \
            go test ./internal/mcprunner -count=1 -v -run 'Root|RealUID'

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Self-host compose renders with a fixture env
        run: |
          docker compose -f deploy/self-host/compose.yaml \
            --env-file deploy/self-host/testdata/tofi.env --profile tls config --quiet
          docker compose -f deploy/self-host/compose.yaml \
            --env-file deploy/self-host/testdata/tofi-direct.env config --quiet
          # The computer is a profile: off by default, on with computer-kvm.
          docker compose -f deploy/self-host/compose.yaml \
            --env-file deploy/self-host/testdata/tofi.env --profile computer-kvm config --services | sort | tr '\n' ' ' \
            | grep -qx 'app worker '
          docker compose -f deploy/self-host/compose.yaml \
            --env-file deploy/self-host/testdata/tofi.env config --services | sort | tr '\n' ' ' \
            | grep -qx 'app '
          # A server without a computer renders with every computer variable empty.
          docker compose -f deploy/self-host/compose.yaml \
            --env-file deploy/self-host/testdata/tofi-none.env config --services | sort | tr '\n' ' ' \
            | grep -qx 'app '
      - name: Docker Compose install (no computer) renders without pulling images
        run: |
          docker compose -f deploy/compose/compose.yaml \
            --env-file deploy/compose/testdata/fixture.env config --quiet
          docker compose -f deploy/compose/compose.yaml \
            --env-file deploy/compose/testdata/fixture.env --profile tls config --quiet
          docker compose -f deploy/compose/compose.yaml \
            --env-file deploy/compose/testdata/fixture.env config --services | grep -qx app
      - name: Runner profile renders with its fenced networks
        run: |
          export TOFI_RUNNER_IMAGE=ghcr.io/jackzhao98/tofi-mcp-runner@sha256:4444444444444444444444444444444444444444444444444444444444444444
          for env in tofi tofi-direct tofi-none; do
            docker compose -f deploy/self-host/compose.yaml \
              --env-file deploy/self-host/testdata/$env.env --profile runner config --quiet
          done
          # The App-to-Runner link is internal, the Runner has its own egress bridge, and no shared IPC.
          docker compose -f deploy/self-host/compose.yaml --env-file deploy/self-host/testdata/tofi-none.env \
            --profile runner config > /tmp/runner-compose.yaml
          grep -q 'internal: true' /tmp/runner-compose.yaml
          grep -q 'subnet: 172.30.77.0/24' /tmp/runner-compose.yaml
          grep -q 'ipc: none' /tmp/runner-compose.yaml
      - name: Dev compose renders
        run: docker compose -f compose.yaml config --quiet
